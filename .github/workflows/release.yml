name: Build & Release

on:
  push:
    branches: [main, experiment/jit-runtime]
    tags: ['v*']
  pull_request:
    branches: [main, experiment/jit-runtime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - name: Resolve release version
        id: version
        shell: pwsh
        run: ./scripts/release-version.ps1
      - name: Check structure and release rules
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Build native loader, runtime and examples
        shell: pwsh
        run: ./scripts/build.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Test packet contracts
        shell: pwsh
        run: dotnet test tests/SF.Network.Contracts.Tests/SF.Network.Contracts.Tests.csproj -c Release
      - name: Install x86 test runtimes
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile artifacts/dotnet-install.ps1
          $installDir = "$pwd/artifacts/dotnet-x86"
          foreach ($runtime in @('dotnet', 'aspnetcore')) {
            ./artifacts/dotnet-install.ps1 -Runtime $runtime -Channel 10.0 -Architecture x86 -InstallDir $installDir -NoPath
          }
          if (!(Test-Path "$installDir/dotnet.exe")) { throw 'x86 dotnet host was not installed' }
          $installedRuntimes = & "$installDir/dotnet.exe" --list-runtimes
          if ($LASTEXITCODE -ne 0 -or
              @($installedRuntimes -match '^Microsoft\.NETCore\.App 10\.0\.').Count -eq 0 -or
              @($installedRuntimes -match '^Microsoft\.AspNetCore\.App 10\.0\.').Count -eq 0) {
            throw "Required x86 .NET 10 runtimes were not installed: $installedRuntimes"
          }
      - name: Test runtime packet handling and managed memory lifetime
        shell: pwsh
        run: |
          dotnet build tests/SF.Network.Tests/SF.Network.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'x86 Runtime test build failed' }
          & "$pwd/artifacts/dotnet-x86/dotnet.exe" artifacts/bin/SF.Network.Tests/Release/net10.0/SF.Network.Tests.dll
          if ($LASTEXITCODE -ne 0) { throw 'x86 Runtime tests failed' }
      - name: Package and verify deployment archive
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version '${{ steps.version.outputs.version }}'
          ./scripts/verify.ps1 -Archive 'artifacts/releases/SF-Arizona-${{ steps.version.outputs.version }}-win-x86.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: SF-Arizona-${{ steps.version.outputs.version }}-win-x86
          path: artifacts/releases/SF-Arizona-${{ steps.version.outputs.version }}-win-x86.zip*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SF-Arizona-${{ needs.build.outputs.version }}-win-x86
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SF-Arizona v${{ needs.build.outputs.version }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
